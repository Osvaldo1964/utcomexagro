<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrativo – UT COMEXAGRO</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link rel="stylesheet" href="css/admin.css?v=2">
</head>
<body>

<div id="app-shell">


  <!-- ============================================================
       ÁREA PRINCIPAL
       ============================================================ -->
  <div id="main-area">

    <!-- Top bar -->
    <header id="topbar">
      <div class="topbar-left" style="display:flex; align-items:center; gap: 1rem;">
        <!-- Logo Button to Dashboard -->
        <div style="display:flex; align-items:center; gap: 0.75rem; cursor:pointer;" onclick="window.location.hash='dashboard'" title="Ir al Inicio">
          <div style="background: linear-gradient(135deg, var(--green-700), var(--green-600)); width: 40px; height: 40px; display:flex; align-items:center; justify-content:center; border-radius: 10px; box-shadow: 0 4px 12px rgba(22,163,74,.35); flex-shrink: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" width="24" height="24">
              <polyline points="60,4 112,104" fill="none" stroke="#F59E0B" stroke-width="9" stroke-linecap="round"/>
              <polyline points="60,4 8,104" fill="none" stroke="white" stroke-width="9" stroke-linecap="round"/>
              <line x1="8" y1="104" x2="112" y2="104" stroke="white" stroke-width="9" stroke-linecap="round"/>
              <path d="M60,97 C60,82 51,67 45,53 C55,62 60,77 60,97Z" fill="white"/>
              <path d="M60,97 C60,82 69,67 75,53 C65,62 60,77 60,97Z" fill="white"/>
              <line x1="60" y1="97" x2="60" y2="55" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <div style="font-weight:700; color:var(--gray-800); font-size:1rem; letter-spacing:-0.02em;">UT COMEXAGRO</div>
            <div style="font-size:0.75rem; color:var(--gray-500);">Panel Administrativo</div>
          </div>
        </div>

        <div style="width:1px; height:30px; background:var(--gray-200); margin:0 0.5rem;"></div>

        <!-- Breadcrumb -->
        <nav class="breadcrumb" aria-label="Navegación">
          <span>🏠</span>
          <span class="breadcrumb-sep">›</span>
          <span class="breadcrumb-current" id="breadcrumb-current">Dashboard</span>
        </nav>
      </div>

      <div class="topbar-right">
        <!-- Reloj -->
        <span class="topbar-time" id="topbar-time">00:00</span>

        <!-- Notificaciones -->
        <div class="topbar-notif" title="Notificaciones">
          🔔
          <div class="notif-badge"></div>
        </div>

        <!-- Avatar / usuario -->
        <div class="topbar-avatar-btn" title="Mi cuenta" style="display:flex; align-items:center; gap:0.5rem;">
          <div class="topbar-avatar" id="topbar-avatar-initial">A</div>
          <div>
            <div class="topbar-uname" id="topbar-user-name">...</div>
            <div class="topbar-rol"   id="topbar-user-rol">...</div>
          </div>
        </div>

        <!-- Logout Button -->
        <button class="btn btn-secondary btn-sm" id="btn-logout" title="Cerrar sesión" style="display:flex; align-items:center; gap:0.25rem;">
          <span>🚪</span>
          <span>Salir</span>
        </button>
      </div>
    </header><!-- /topbar -->

    <!-- Contenido dinámico -->
    <main id="content" role="main">
      <!-- Cargando... -->
      <div style="padding:3rem;text-align:center;color:var(--gray-400)">
        <div style="font-size:2rem;margin-bottom:.5rem">🌿</div>
        Cargando panel...
      </div>
    </main>

  </div><!-- /main-area -->

</div><!-- /app-shell -->

<!-- Scripts – orden importante -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../assets/js/colombia-data.js"></script>
<script src="js/auth.js?v=2"></script>
<script src="js/api.js?v=2"></script>
<script src="js/modules/organizaciones.js?v=2"></script>
<script src="js/modules/postulados.js?v=2"></script>
<script src="js/modules/configuracion.js?v=2"></script>
<script src="js/modules/beneficiarios.js?v=2"></script>
<script src="js/modules/cargos.js?v=2"></script>
<script src="js/modules/encuestas.js?v=2"></script>
<script src="js/modules/pqrs.js?v=2"></script>
<script src="js/modules/presupuesto.js?v=2"></script>
<script src="js/modules/presupuesto_rubros.js?v=2"></script>
<script src="js/modules/presupuesto_movimientos.js?v=2"></script>
<script src="js/modules/presupuesto_traslados.js?v=2"></script>
<script src="js/modules/terceros.js?v=2"></script>
<script src="js/modules/informes.js?v=2"></script>
<script src="js/modules/informes_mov_traslados.js?v=2"></script>
<script src="js/app.js?v=2"></script>

</body>
</html>
